# Run configuration. See full config spec in src/types/Configuration.d.ts

# ADB server configuration
adbServers:
  - host: 127.0.0.1
    port: 5037

adbListenAllInterfaces: true

# HTTP server configuration
server:
  - secure: false
    port: 8000

# Cambrionix Hub Manager sources
cambrionixSources:
  - name: hub-a
    enable: true
    baseUrl: http://192.168.200.59:9595
    path: /api/v1/port
    timeoutMs: 5000
    retryDelayMs: 10000
    cacheMs: 30000
    pollMs: 20000
  - name: hub-b
    enable: true
    baseUrl: http://92.168.200.37:9595
    path: /api/v1/port
    timeoutMs: 5000
    retryDelayMs: 10000
    cacheMs: 30000
    pollMs: 20000
