# Run configuration example. See full config file spec in src/types/Configuration.d.ts

# Device trackers
## track android devices (default: true, if was INCLUDE_GOOG enabled in build config)
runGoogTracker: false
## track iOS devices (default: true, if was INCLUDE_APPL enabled in build config)
runApplTracker: false;

# ADB server configuration
## List of ADB servers to connect to (devices from all servers are aggregated)
adbServers:
  - host: 127.0.0.1
    port: 5037
  ## Optionally add remote ADB servers:
  # - host: 192.168.1.100
  #   port: 5037
## Start local ADB daemon listening on all network interfaces at server startup (default: true)
## This allows remote adb clients to connect to THIS machine's ADB server
adbListenAllInterfaces: true

# Statically configured iOS devices whose WebDriverAgent already runs elsewhere (e.g. built/signed
# via Xcode on a separate Mac) and is reachable from this host, typically through an SSH port-forward
# or other tunnel to the device's WDA port. Bypasses local usbmuxd discovery and xcodebuild.
applDeviceList:
  - udid: '00008101-001220200CB8001E'
    name: 'iPhone (lab)'
    # base URL of a running Appium server (with XCUITest driver) that already has local
    # Xcode/usbmuxd access to this device - it manages the WDA session on our behalf
    webDriverAgentUrl: 'http://192.168.200.37:4723'
    # local port already tunneled to the device's WDA MJPEG broadcaster (see README), optional
    mjpegLocalPort: 9200

# HTTP[s] servers configuration
server:
  - secure: false
    port: 8000
    redirectToSecure:
      port: 8443
      host: first-mobile-stand.example.com
  - secure: true
    port: 8443
    options:
      certPath: /Users/example/ssl/STAR_example_com.crt
      keyPath: /Users/example/ssl/STAR_example_com.key

# Announce remote device trackers. The server doesn't check their availability.
remoteHostList:
  - useProxy: true   # optional, default: false
    type: android    # required, "android" | "ios" | ["android", "ios"]
    secure: true     # required, false for HTTP, true for HTTPS
    hostname: second-mobile-stand.example.com
    port: 8443
  - useProxy: true
    type: ios
    secure: true
    hostname: second-mobile-stand.example.com
    port: 8443
  - useProxy: true
    type:           # short variant
      - ios
      - android
    secure: true
    hostname: third-mobile-stand.example.com
    port: 8443

# Cambrionix Hub Manager enrichment (optional)
# List up to N Cambrionix sources.  Each source is polled independently.
# If a source is unreachable, the other source(s) continue working normally.
# Remove or set enable: false to disable a source without removing its config.
cambrionixSources:
  - name: hub-a                          # label used in logs/metrics
    enable: true
    baseUrl: http://10.0.0.10:9595       # Hub Manager base URL
    path: /api/v1/port                   # API path (default: /api/v1/port)
    timeoutMs: 5000                      # per-request timeout (ms)
    retryDelayMs: 10000                  # delay before retry on error (ms)
    cacheMs: 30000                       # cache TTL (ms)
    pollMs: 20000                        # background poll interval (ms)
  - name: hub-b
    enable: true
    baseUrl: http://10.0.0.11:9595
    path: /api/v1/port
    timeoutMs: 5000
    retryDelayMs: 10000
    cacheMs: 30000
    pollMs: 20000
